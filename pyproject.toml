[project]
name = "co2-factor-forecasting"
version = "0.1.0"
description = "Week-ahead hourly CO2 factor forecast for Dutch electricity from NED's renewable and demand forecasts"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.106",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
